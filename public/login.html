<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion | Pop Corner</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <main class="login-layout">
        <section class="login-visual" aria-label="Pop Corner, boutique de figurines">
            <a class="brand brand-light" href="/login"><span
                    class="brand-mark">P!</span><span>POP<br><strong>CORNER</strong></span></a>
            <div class="login-figure" aria-hidden="true">
                <div class="figure-head"><span class="eye left"></span><span class="eye right"></span><span
                        class="smile"></span></div>
                <div class="figure-body"><span class="shirt-star">★</span></div>
                <div class="figure-feet"><span></span><span></span></div>
            </div>
            <p class="visual-caption">COLLECT<br><strong>THE ICONIC.</strong></p>
        </section>

        <section class="login-panel">
            <div class="eyebrow">ESPACE COLLECTIONNEUR</div>
            <h1>Bienvenue<br>chez <em>Pop.</em></h1>
            <p class="intro">Retrouve tes figurines préférées et les drops qui vont faire vibrer ton étagère.</p>

            <form id="login-form">
                <label for="email">Adresse email</label>
                <input id="email" name="email" type="email" autocomplete="email" required value="demo@example.com">

                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">
                    Ouvrir la session <span>↗</span>
                </button>

                <p class="hint">Compte démo : demo@example.com / Demo1234!</p>
                <p id="login-error" class="error" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script type="module" src="/login.js"></script>
</body>

</html>
